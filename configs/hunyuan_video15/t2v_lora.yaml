plugins:
  - lightx2v_train_plugin.hunyuan_video15

runtime:
  seed: 42

model:
  name: hunyuan_video15_t2v
  pretrained_model_name_or_path: ${oc.env:HY15_MODEL_ROOT,/data/models/HunyuanVideo-1.5}
  transformer_version: 480p_t2v
  running_dtype: bf16
  transformer_param_dtype: bf16
  latent_dtype: bf16
  vae_dtype: bf16
  text_encoder_dtype: bf16
  load_transformer: true
  load_vae: false
  load_text_encoder: false

distributed:
  backend: nccl
  timeout_minutes: 60
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: true
    size: ${oc.env:WORLD_SIZE,1}
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false

data:
  train:
    name: cache_dataset
    data_path:
      - ${oc.env:HY15_CACHE_DIR,/data/wushuo/lightx2v_train_plugin/outputs/hunyuan_video15/cache}/cache_data.jsonl
    prompt_dropout_rate: 0.0
    num_workers: 0
    pin_memory: true
    shuffle: true

scheduler:
  num_train_timesteps: 1000
  timestep_distribution: logitnormal
  logitnormal_mean: 0.0
  logitnormal_std: 1.0
  min_sigma: 0.001
  max_sigma: 1.0
  time_shift_settings:
    do_time_shift: true
    dynamic_shift: false
    shift_type: linear
    time_shift_mu: 3.0
    time_shift_power: 1.0

training:
  method: hunyuan_video15_sft
  train_type: lora
  max_train_iters: 1000
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  gradient_checkpointing_offload: false
  max_grad_norm: 1.0
  lr_scheduler: constant_with_warmup
  lr_warmup_iters: 100
  save_every_iters: 100
  save_total_limit: 2
  lora:
    rank: 32
    alpha: 32
    target_modules: [to_q, to_k, to_v, to_out.0, add_q_proj, add_k_proj, add_v_proj, to_add_out]
  optimizer:
    learning_rate: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    weight_decay: 0.01
    adam_epsilon: 0.00000001
  output_dir: ${oc.env:HY15_OUTPUT_ROOT,/data/wushuo/lightx2v_train_plugin/outputs/hunyuan_video15}/lora

inference:
  method: none

logging:
  rank_zero_only: true
  train_log_every_iters: 10

resume:
  auto_resume: false
