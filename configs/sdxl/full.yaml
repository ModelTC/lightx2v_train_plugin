plugins:
  - lightx2v_train_plugin.sdxl

runtime:
  seed: 42

model:
  name: sdxl
  pretrained_model_name_or_path: ${oc.env:SDXL_MODEL_ROOT,/data/models/stable-diffusion-xl-base-1.0}
  unet_path: ${oc.env:SDXL_UNET_ROOT,${model.pretrained_model_name_or_path}/unet}
  running_dtype: bf16
  transformer_param_dtype: fp32
  latent_dtype: fp32
  text_encoder_dtype: bf16
  vae_dtype: fp32

distributed:
  backend: nccl
  timeout_minutes: 60
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: true
    size: ${oc.env:WORLD_SIZE,1}
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false

data:
  processor:
    name: sdxl
    target_area: 1048576
    size_multiple: 64
  train:
    name: cache_dataset
    data_path:
      - ${oc.env:SDXL_CACHE_DIR,${oc.env:SDXL_OUTPUT_ROOT,/data/wushuo/lightx2v_train_plugin/outputs/sdxl}/cache}/cache_data.jsonl
    prompt_dropout_rate: 0.0
    num_workers: 0
    pin_memory: true
    shuffle: true

scheduler:
  num_train_timesteps: 1000
  prediction_type: epsilon
  timestep_distribution: uniform
  time_shift_settings:
    do_time_shift: false

training:
  method: sdxl_sft
  train_type: full
  max_train_iters: 1000
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler: constant_with_warmup
  lr_warmup_iters: 100
  save_every_iters: 100
  save_total_limit: 2
  optimizer:
    learning_rate: 0.00001
    adam_beta1: 0.9
    adam_beta2: 0.999
    weight_decay: 0.01
    adam_epsilon: 0.00000001
  output_dir: ${oc.env:SDXL_OUTPUT_ROOT,/data/wushuo/lightx2v_train_plugin/outputs/sdxl}/full

inference:
  method: none

logging:
  rank_zero_only: true
  train_log_every_iters: 10

resume:
  auto_resume: false
