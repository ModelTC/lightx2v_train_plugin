plugins:
  - lightx2v_train_plugin.z_image

runtime:
  seed: 42

model:
  name: z_image
  pretrained_model_name_or_path: ${oc.env:Z_IMAGE_MODEL_ROOT,/data/models/Z-Image}
  max_sequence_length: 512
  running_dtype: bf16
  transformer_param_dtype: bf16
  latent_dtype: fp32
  text_encoder_dtype: bf16
  vae_dtype: fp32

distributed:
  backend: nccl
  timeout_minutes: 60
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: true
    size: ${oc.env:WORLD_SIZE,1}
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false

data:
  processor:
    name: z_image
    target_area: 1048576
    size_multiple: 16
  train:
    name: cache_dataset
    data_path:
      - ${oc.env:Z_IMAGE_CACHE_DIR,/data/wushuo/lightx2v_train_plugin/outputs/z_image_base/cache}/cache_data.jsonl
    prompt_dropout_rate: 0.1
    num_workers: 0
    pin_memory: true
    shuffle: true

scheduler:
  num_train_timesteps: 1000
  timestep_distribution: logitnormal
  logitnormal_mean: 0.0
  logitnormal_std: 1.0
  min_sigma: 0.001
  max_sigma: 1.0
  time_shift_settings:
    do_time_shift: true
    shift_type: linear
    time_shift_mu: 6.0
    time_shift_power: 1.0
    dynamic_shift: false

training:
  method: flow_matching
  train_type: lora
  max_train_iters: 1000
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_iters: 0
  save_every_iters: 100
  save_total_limit: 2
  lora:
    rank: 16
    alpha: 16
    target_modules: [to_q, to_k, to_v, to_out.0, w1, w2, w3]
  optimizer:
    learning_rate: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    weight_decay: 0.01
    adam_epsilon: 0.00000001
  output_dir: ${oc.env:Z_IMAGE_OUTPUT_DIR,/data/wushuo/lightx2v_train_plugin/outputs/z_image_base/lora}

inference:
  method: none

logging:
  rank_zero_only: true
  train_log_every_iters: 10

resume:
  auto_resume: false
