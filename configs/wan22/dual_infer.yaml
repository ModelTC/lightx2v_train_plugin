plugins:
  - lightx2v_train_plugin.wan22

runtime:
  seed: 42

model:
  name: wan22_t2v_a14b
  expert: high
  pretrained_model_name_or_path: ${oc.env:WAN22_MODEL_ROOT,/data/models/Wan2.2-T2V-A14B}
  running_dtype: bf16
  transformer_param_dtype: bf16
  latent_dtype: bf16
  vae_dtype: bf16
  t5_dtype: bf16
  load_transformer: true
  load_vae: true
  load_text_encoder: true
  student_2:
    expert: low
    lora_path: ${oc.env:WAN22_LOW_LORA,/data/wushuo/lightx2v_train_plugin/outputs/low_lora/checkpoint-000000250/pytorch_lora_weights.safetensors}

distributed:
  backend: nccl
  timeout_minutes: 60
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: true
    size: ${oc.env:WORLD_SIZE,1}
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false

data:
  val:
    name: prompt_dataset
    data_path:
      - ${oc.env:WAN22_VALIDATION_PROMPTS,/data/wushuo/lightx2v_train_plugin/configs/wan22/validation_prompts.txt}
    num_workers: 0
    shuffle: false

scheduler:
  num_train_timesteps: 1000
  shift: 5.0
  min_sigma: 0.001
  max_sigma: 1.0
  time_shift_settings:
    do_time_shift: false

inference:
  method: wan22_t2v_infer
  scheduler_type: euler
  boundary_sigma: 0.875
  sigma_shift: 5.0
  rand_device: cpu
  default_height: 480
  default_width: 832
  num_frames: 49
  num_inference_steps: 50
  fps: 24
  enable_cfg: true
  cfg_guidance_scale: 5.0
  negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
  seed: ${oc.env:WAN22_SEED,0}
  output_dir: ${oc.env:WAN22_INFER_OUTPUT,/data/wushuo/lightx2v_train_plugin/outputs/inference}
  lora_config:
    path: ${oc.env:WAN22_HIGH_LORA,/data/wushuo/lightx2v_train_plugin/outputs/high_lora/checkpoint-000000250/pytorch_lora_weights.safetensors}
    rank: 32
    alpha: 32
    target_modules: [q, k, v, o, ffn.0, ffn.2]

logging:
  rank_zero_only: true
  infer_log_every_steps: 10
