plugins:
  - lightx2v_train_plugin.hunyuan_video15

runtime:
  seed: 42

model:
  name: hunyuan_video15_t2v
  pretrained_model_name_or_path: ${oc.env:HY15_MODEL_ROOT,/data/models/HunyuanVideo-1.5}
  transformer_version: 480p_t2v
  running_dtype: bf16
  transformer_param_dtype: bf16
  latent_dtype: bf16
  vae_dtype: bf16
  text_encoder_dtype: bf16
  load_transformer: false
  load_vae: true
  load_text_encoder: true

distributed:
  backend: nccl
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: false

data:
  train:
    name: video_dataset
    data_path:
      - ${oc.env:HY15_METADATA,/data/wushuo/lightx2v_train_plugin/data/hunyuan_video15/metadata.csv}
    video_column: video
    prompt_column: prompt
    height: 480
    width: 832
    num_frames: 49
    frame_rate: 24
    fix_frame_rate: false
    random_start: false
    dataset_repeat: 1
    prompt_dropout_rate: 0.0
    skip_missing: false
    num_workers: 0

scheduler:
  num_train_timesteps: 1000
  timestep_distribution: logitnormal
  logitnormal_mean: 0.0
  logitnormal_std: 1.0
  min_sigma: 0.001
  max_sigma: 1.0
  time_shift_settings:
    do_time_shift: true
    dynamic_shift: false
    shift_type: linear
    time_shift_mu: 3.0
    time_shift_power: 1.0

training:
  method: flow_matching

inference:
  method: none

logging:
  rank_zero_only: true
